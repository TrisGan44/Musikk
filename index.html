<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Soundwave - Music Visualizer & Editor</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="container">
    <header class="header">
      <h1>Soundwave</h1>
      <p>Unggah audio, edit, balikkan (reverse) berkali‑kali, lalu unduh hasilnya.</p>
    </header>

    <section class="viz card">
      <canvas id="visualizer" width="960" height="240" aria-label="Visualisasi audio"></canvas>
    </section>

    <section class="timeline card" aria-label="Timeline editor">
      <div class="timeline-header">
        <div>
          <p class="eyebrow">Editor</p>
          <h2>Timeline</h2>
          <small>Geser playhead, klik, atau drag untuk loncat waktu. Tambahkan klip berdasarkan rentang trim.</small>
        </div>
        <div class="timeline-actions" aria-label="Kontrol timeline">
          <button id="zoomOutBtn" class="btn" aria-label="Zoom out" disabled>−</button>
          <button id="zoomInBtn" class="btn" aria-label="Zoom in" disabled>+</button>
          <button id="zoomResetBtn" class="btn" aria-label="Reset zoom" disabled>Reset</button>
          <button id="addMarkerBtn" class="btn" aria-label="Tambah marker" disabled>+ Marker</button>
          <button id="addClipBtn" class="btn" disabled>+ Tambah Klip</button>
        </div>
      </div>

      <div class="timeline-shell">
        <div class="timeline-ruler" id="timelineRuler" aria-hidden="true"></div>
        <div class="timeline-body" id="timelineBody">
          <div class="timeline-hover" id="timelineHover" aria-hidden="true"></div>
          <div class="timeline-content" id="timelineContent">
            <div class="playhead" id="playhead" role="presentation" aria-label="Playhead" tabindex="0"></div>
            <div class="marker-layer" id="markerLayer" aria-hidden="true"></div>
            <div class="track" id="timelineTrack">
              <div class="clip base" id="baseClip">Audio</div>
              <div class="clip selection" id="selectionClip" hidden>
                <div class="handle handle-start" data-handle="start" aria-label="Geser awal trim"></div>
                <div class="handle handle-end" data-handle="end" aria-label="Geser akhir trim"></div>
                <div class="clip-label" id="selectionLabel"></div>
              </div>
            </div>
            <div class="track" id="clipTrack"></div>
          </div>
        </div>
        <div class="timeline-minimap" id="timelineMinimap" aria-hidden="true"></div>
      </div>
    </section>

    <section class="uploader card">
      <label class="file-label">
        <input type="file" id="fileInput" accept="audio/*" />
        <span>Pilih Berkas Audio</span>
      </label>
      <div id="fileMeta" class="file-meta" hidden></div>
      <div id="error" class="error" hidden></div>
    </section>

    <section class="controls card" aria-label="Pemutar">
      <div class="row">
        <button id="playBtn" class="btn primary" disabled>Putar</button>
        <button id="stopBtn" class="btn" disabled>Stop</button>
        <button id="reverseBtn" class="btn" disabled>Reverse: OFF</button>
        <button id="downloadBtn" class="btn" disabled>Unduh WAV</button>
      </div>

      <div class="row">
        <label class="stack">
          <span>Waktu</span>
          <input type="range" id="progress" min="0" max="1000" value="0" step="1" disabled />
          <div class="time">
            <span id="currentTime">0:00</span>
            <span id="duration">0:00</span>
          </div>
        </label>
      </div>

      <div class="row grid-3">
        <label class="stack">
          <span>Volume</span>
          <input type="range" id="volume" min="0" max="1" value="1" step="0.01" disabled />
        </label>
        <label class="stack">
          <span>Kecepatan</span>
          <input type="range" id="rate" min="0.5" max="2" value="1" step="0.05" disabled />
          <small id="rateLabel">1.00×</small>
        </label>
        <label class="stack">
          <span>Visual Gain</span>
          <input type="range" id="vizGain" min="0.5" max="4" value="1.5" step="0.1" />
        </label>
      </div>
    </section>

    <section class="edit card" aria-label="Potong">
      <div class="row grid-3">
        <label class="stack">
          <span>Potong dari (detik)</span>
          <input type="number" id="trimStart" min="0" step="0.01" value="0" disabled />
        </label>
        <label class="stack">
          <span>Sampai (detik)</span>
          <input type="number" id="trimEnd" min="0" step="0.01" value="5" disabled />
        </label>
        <div class="stack">
          <span>&nbsp;</span>
          <button id="applyCutBtn" class="btn warn" disabled>Terapkan Potong</button>
        </div>
      </div>
      <small>Tips: Reverse bisa diklik berkali‑kali. Klik 2× untuk kembali normal.</small>
    </section>

    <footer class="footer">
      <small>Made with Web Audio API</small>
    </footer>
  </main>

  <script src="script.js"></script>
</body>
</html>
